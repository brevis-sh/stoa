#: O gateway do stoa: uma rota, `POST /v1/events`, que vira landing NDJSON no S3.
#: O engine lê este arquivo pelo `gateway describe` + `brevis gateway publish`
#: que o `make up` roda, e o mostra em /data e /ingest/streams.
name: stoa
listen:
  addr: :8080
  #: Um POST pode trazer um lote NDJSON inteiro; 20.000 eventos são ~4 MiB.
  max_body: 32MiB
metrics:
  addr: :9090
streams:
  #: Os eventos do e-commerce fictício do stoa, um por linha.
  - name: events
    path: /v1/events
    format: ndjson
    identity:
      provider: stoa
      entity: events
      source_key: event_id
      record_ts: occurred_at
    #: O gateway carimba ingestion_loaded_at ao aceitar: é a hora em que o
    #: evento entrou no lake, e a tabela Iceberg a leva como coluna.
    stamp_loaded_at: true
    buffer:
      durability: memory
      flush:
        #: Um objeto na landing a cada 20.000 eventos ou dois segundos, o que
        #: vier primeiro: é o que o `land` transforma num snapshot por lote.
        every: 2s
        records: 20000
        size: 16MiB
      workers: 2
      queue: 16
      max_records: 200000
      max_bytes: 256MiB
    sink:
      #: A landing, que o step `land` lê e leva para a tabela Iceberg.
      type: files
      path: s3://lake/landing/events/
    retry:
      attempts: 4
      backoff: 500ms
      max_backoff: 10s
    dead_letter:
      type: files
      path: /var/dead-letter/events/
