#: The stoa gateway: one route, `POST /v1/events`, becoming an NDJSON landing on S3.
#: The engine reads this file through the `gateway describe` + `brevis gateway publish`
#: that `make up` runs, and shows it under /data and /ingest/streams.
name: stoa
listen:
  addr: :8080
  #: One POST may carry a whole NDJSON batch; 20,000 events are about 4 MiB.
  max_body: 32MiB
metrics:
  addr: :9090
streams:
  #: The events of stoa's fictional shop, one per line.
  - name: events
    path: /v1/events
    format: ndjson
    identity:
      provider: stoa
      entity: events
      source_key: event_id
      record_ts: occurred_at
    #: The gateway stamps ingestion_loaded_at on acceptance: it is the moment the
    #: event entered the lake, and the Iceberg table carries it as a column.
    stamp_loaded_at: true
    buffer:
      durability: memory
      flush:
        #: One object in the landing every 20,000 events or two seconds, whichever
        #: comes first: that is what `land` turns into one snapshot per batch.
        every: 2s
        records: 20000
        size: 16MiB
      workers: 2
      queue: 16
      max_records: 200000
      max_bytes: 256MiB
    sink:
      #: The landing, which the `land` step reads and carries into the Iceberg table.
      type: files
      path: s3://lake/landing/events/
    retry:
      attempts: 4
      backoff: 500ms
      max_backoff: 10s
    dead_letter:
      type: files
      path: /var/dead-letter/events/
