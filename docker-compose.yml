# O lake do stoa. Nenhum container é Java.
#
# SeaweedFS é o S3: um binário em Go, imagem oficial, versão PINADA -- um
# `latest` que muda sozinho é um demo que quebra na manhã em que ninguém mexeu
# em nada. O `-s3.config` dá identidade ao bucket: sem ele, o filer perde os
# metadados num reinício e o PutObject seguinte responde 403 (spike S1,
# 2026-11-02). O volume `seaweedfs` guarda dados e filer entre reinícios.
#
# Postgres guarda dois bancos: `lake`, o catálogo Iceberg, e `brevis`, o engine.
# A porta 55439 existe para não brigar com o compose do brevis (55432).
#
# O brevis vem em duas imagens publicadas, com a mesma versão: `brevis` é a API
# e o console (distroless, não roda nada); `brevis-worker` é o scheduler, que
# executa os steps como processos locais -- por isso o `bin/` deste repo, com
# os binários compilados para Linux, é montado nele.
#
# O brevis-gateway é a porta de entrada dos eventos: `POST /v1/events` e um
# 202, a landing NDJSON no S3 por conta dele. Não compartilha nada com o engine
# em runtime; o console o conhece porque o `make up` publica a descrição dele
# (`describe` + `publish-gateway`, abaixo), como faz com um workflow.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256
    volumes:
      - seaweedfs:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stoa
      POSTGRES_PASSWORD: stoa
      POSTGRES_DB: lake
    ports:
      - "55439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoa -d lake"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: brevissh/brevis:0.41.0
    command: ["migrate", "up"]
    environment:
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  brevis:
    image: brevissh/brevis:0.41.0
    command: ["serve"]
    environment:
      BREVIS_ENV: local
      BREVIS_HTTP_ADDR: ":8080"
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: info
      # O login do console vem do .env.local, feito pelo `make up` e nunca
      # comitado: o repositório é público.
      BREVIS_AUTH_USER: ${BREVIS_AUTH_USER:-}
      BREVIS_AUTH_PASSWORD_HASH: ${BREVIS_AUTH_PASSWORD_HASH:-}
      BREVIS_AUTH_SECRET: ${BREVIS_AUTH_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  scheduler:
    image: brevissh/brevis:0.41.0-worker
    command: ["scheduler", "--interval", "5s", "--concurrency", "2"]
    environment:
      BREVIS_ENV: local
      BREVIS_PODS: "off"     # sem cluster aqui: os steps são processos neste container
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: info
      # O que o engine repassa a cada step: o lake, visto de dentro da rede
      # do compose.
      BREVIS_TASK_ENV: STOA_S3_ENDPOINT,STOA_S3_KEY,STOA_S3_SECRET,STOA_S3_REGION,STOA_BUCKET,STOA_PG_DSN,STOA_FLUSH_EVERY
      STOA_S3_ENDPOINT: http://seaweedfs:8333
      STOA_S3_KEY: stoa
      STOA_S3_SECRET: stoa-secret
      STOA_S3_REGION: us-east-1
      STOA_BUCKET: lake
      STOA_PG_DSN: postgres://stoa:stoa@postgres:5432/lake?sslmode=disable
      STOA_FLUSH_EVERY: "20000"
    volumes:
      - ./bin:/opt/brevis/bin:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  gateway:
    image: brevissh/brevis-gateway:0.33.0
    environment:
      BREVIS_ENV: local            # sem token: localmente a porta fica aberta, e o gateway diz isso no log
      AWS_ACCESS_KEY_ID: stoa
      AWS_SECRET_ACCESS_KEY: stoa-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://seaweedfs:8333   # com esta variável o gateway usa path style, que é o que o SeaweedFS fala
    volumes:
      - ./deploy/gateway/gateway.yaml:/etc/brevis/gateway.yaml:ro
    ports:
      - "8081:8080"
    depends_on:
      - seaweedfs
    restart: unless-stopped

  # Dois comandos, não serviços, que o `make up` roda em sequência: `describe`
  # imprime o manifesto do gateway a partir do YAML, na imagem do gateway, e o
  # Makefile o guarda em .manifest/ (a imagem roda como nonroot e um volume
  # nomeado nasce do root, então o stdout é o caminho); `publish-gateway` o
  # entrega ao engine.
  describe:
    profiles: [ops]
    image: brevissh/brevis-gateway:0.33.0
    command: ["describe", "/etc/brevis/gateway.yaml"]
    volumes:
      - ./deploy/gateway/gateway.yaml:/etc/brevis/gateway.yaml:ro
    restart: "no"

  publish-gateway:
    profiles: [ops]
    image: brevissh/brevis:0.41.0
    command: ["gateway", "publish", "/manifest/manifest.json"]
    environment:
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
    volumes:
      - ./.manifest/manifest.json:/manifest/manifest.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: "no"

  # Um comando, não um serviço: `docker compose run --rm publish` escreve os
  # workflows no banco do engine. O perfil `ops` o mantém fora do `up`.
  publish:
    profiles: [ops]
    image: brevissh/brevis:0.41.0
    command: ["publish", "/workflows", "--project", "stoa", "--prune"]
    environment:
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
    volumes:
      - ./workflows:/workflows:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: "no"

volumes:
  seaweedfs:
  pgdata:
