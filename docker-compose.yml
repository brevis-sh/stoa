# The stoa lake. Not one container is Java.
#
# SeaweedFS is the S3: a single Go binary, official image, PINNED version -- a
# `latest` that moves on its own is a demo that breaks on the morning nobody
# touched anything. `-s3.config` gives the bucket an identity: without it the
# filer loses its metadata on a restart and the next PutObject answers 403
# (spike S1, 2026-11-02). The `seaweedfs` volume keeps data and filer across
# restarts.
#
# Postgres holds two databases: `lake`, the Iceberg catalog, and `brevis`, the
# engine. Port 55439 exists so it does not collide with Brevis's own compose
# file (55432).
#
# Brevis comes in two published images, at the same version: `brevis` is the
# API and the console (distroless, it runs nothing); `brevis-worker` is the
# scheduler, which runs the steps as local processes -- which is why this
# repository's `bin/`, holding the Linux builds, is mounted into it.
#
# brevis-gateway is the events' front door: `POST /v1/events` and a 202, the
# NDJSON landing on S3 its own business. It shares nothing with the engine at
# runtime; the console knows it because `make up` publishes its description
# (`describe` + `publish-gateway`, below), as it does for a workflow.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256
    volumes:
      - seaweedfs:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stoa
      POSTGRES_PASSWORD: stoa
      POSTGRES_DB: lake
    ports:
      - "55439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoa -d lake"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: brevissh/brevis:0.41.0
    command: ["migrate", "up"]
    environment:
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  brevis:
    image: brevissh/brevis:0.41.0
    command: ["serve"]
    environment:
      BREVIS_ENV: local
      BREVIS_HTTP_ADDR: ":8080"
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: info
      # The console's login comes from .env.local, made by `make up` and never
      # committed: this repository is public.
      BREVIS_AUTH_USER: ${BREVIS_AUTH_USER:-}
      BREVIS_AUTH_PASSWORD_HASH: ${BREVIS_AUTH_PASSWORD_HASH:-}
      BREVIS_AUTH_SECRET: ${BREVIS_AUTH_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  scheduler:
    # The published worker plus the libstdc++ the DuckDB CLI asks for; see
    # deploy/scheduler/Dockerfile.
    build: deploy/scheduler
    image: stoa/scheduler:local
    command: ["scheduler", "--interval", "5s", "--concurrency", "2"]
    environment:
      BREVIS_ENV: local
      BREVIS_PODS: "off"     # no cluster here: the steps are processes in this container
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: info
      # What the engine hands to every step: the lake, as seen from inside the
      # compose network.
      BREVIS_TASK_ENV: STOA_S3_ENDPOINT,STOA_S3_KEY,STOA_S3_SECRET,STOA_S3_REGION,STOA_BUCKET,STOA_PG_DSN,STOA_FLUSH_EVERY,STOA_DUCKDB
      STOA_S3_ENDPOINT: http://seaweedfs:8333
      STOA_S3_KEY: stoa
      STOA_S3_SECRET: stoa-secret
      STOA_S3_REGION: us-east-1
      STOA_BUCKET: lake
      STOA_PG_DSN: postgres://stoa:stoa@postgres:5432/lake?sslmode=disable
      STOA_FLUSH_EVERY: "20000"
      STOA_DUCKDB: /opt/brevis/bin/duckdb
    volumes:
      - ./bin:/opt/brevis/bin:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # The API's cache. Its keys are generated from the gold table's snapshot id,
  # so it never serves a stale gold and never needs a TTL that guesses.
  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

  # The metrics API: it reads the gold through DuckDB, cached in Redis per
  # snapshot. It runs on an Alpine with the CLI's libstdc++ (deploy/runtime),
  # with the binary and the CLI mounted from bin/, like the steps in the
  # scheduler.
  api:
    build: deploy/runtime
    image: stoa/runtime:local
    command: ["/opt/stoa/bin/api"]
    environment:
      STOA_API_ADDR: ":8082"
      STOA_REDIS: redis:6379
      STOA_DUCKDB: /opt/stoa/bin/duckdb
      STOA_S3_ENDPOINT: http://seaweedfs:8333
      STOA_S3_KEY: stoa
      STOA_S3_SECRET: stoa-secret
      STOA_S3_REGION: us-east-1
      STOA_BUCKET: lake
      STOA_PG_DSN: postgres://stoa:stoa@postgres:5432/lake?sslmode=disable
    volumes:
      - ./bin:/opt/stoa/bin:ro
    ports:
      - "8082:8082"
    depends_on:
      redis: {condition: service_started}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  gateway:
    image: brevissh/brevis-gateway:0.33.0
    environment:
      BREVIS_ENV: local            # no token: the door stays open locally, and the gateway says so in its log
      AWS_ACCESS_KEY_ID: stoa
      AWS_SECRET_ACCESS_KEY: stoa-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://seaweedfs:8333   # with this variable the gateway uses path style, which is what SeaweedFS speaks
    volumes:
      - ./deploy/gateway/gateway.yaml:/etc/brevis/gateway.yaml:ro
    ports:
      - "8081:8080"
    depends_on:
      - seaweedfs
    restart: unless-stopped

  # Two commands, not services, that `make up` runs in sequence: `describe`
  # prints the gateway's manifest from the YAML, in the gateway's own image,
  # and the Makefile keeps it under .manifest/ (the image runs as nonroot and a
  # named volume is born owned by root, so stdout is the way); `publish-gateway`
  # hands it to the engine.
  describe:
    profiles: [ops]
    image: brevissh/brevis-gateway:0.33.0
    command: ["describe", "/etc/brevis/gateway.yaml"]
    volumes:
      - ./deploy/gateway/gateway.yaml:/etc/brevis/gateway.yaml:ro
    restart: "no"

  publish-gateway:
    profiles: [ops]
    image: brevissh/brevis:0.41.0
    command: ["gateway", "publish", "/manifest/manifest.json"]
    environment:
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
    volumes:
      - ./.manifest/manifest.json:/manifest/manifest.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: "no"

  # One command, not a service: `docker compose run --rm publish` writes the
  # workflows into the engine's database. The `ops` profile keeps it out of
  # `up`.
  publish:
    profiles: [ops]
    image: brevissh/brevis:0.41.0
    command: ["publish", "/workflows", "--project", "stoa", "--prune"]
    environment:
      BREVIS_DATABASE_URL: postgres://stoa:stoa@postgres:5432/brevis?sslmode=disable
    volumes:
      - ./workflows:/workflows:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: "no"

volumes:
  seaweedfs:
  pgdata:
