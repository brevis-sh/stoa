# The lake's workflow, as the engine sees it: `land` and, after it, `metrics`.
#
# No `schedule`: `land` re-reads the whole landing on every run, so two runs
# over the same landing would double the table. One run per seed, from the
# console's button or from `make run`. A later episode partitions the landing
# by hour and has the step read only what has not landed yet.
name: lake
description: The NDJSON landing becomes bronze.events; DuckDB aggregates and writes gold.daily_revenue.
type: dag
tags: [stoa, lake, go]

steps:
  #: The NDJSON landing on S3 becomes bronze.events, one snapshot per batch.
  - id: land
    run: /opt/brevis/bin/land
    runtime: go

  #: DuckDB aggregates the bronze per day and host, and iceberg-go commits the
  #: gold: a new version of gold.daily_revenue on every run, with computed_at.
  - id: metrics
    run: /opt/brevis/bin/metrics
    runtime: go
    tools: [duckdb]
    depends_on:
      - {step: land, label: bronze landed}
